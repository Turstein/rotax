name: rotax
channels:
  - conda-forge
  - bioconda
  - defaults
channel_priority: strict
dependencies:
  # Core Python
  - python=3.11
  - pip
  - setuptools
  - wheel
  - numpy
  - pandas=2.2
  - biopython=1.84

  # Rotavirus typing / database tools
  - blast>=2.12
  - entrez-direct

  # Read preprocessing / assembly
  - trimmomatic=0.39
  - bbmap>=39.01
  - spades=4.0
  - openjdk=11

  # Alignment and mapping consensus
  - bwa>=0.7.17
  - samtools>=1.18
  - bcftools>=1.18
  - mafft>=7.5

  # Compression / utilities
  - pbzip2
  - wget